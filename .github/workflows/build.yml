name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            name: officecli-mac-arm64
            os: macos-latest
          - rid: osx-x64
            name: officecli-mac-x64
            os: macos-latest
          - rid: linux-x64
            name: officecli-linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            name: officecli-linux-arm64
            os: ubuntu-latest
          - rid: linux-musl-x64
            name: officecli-linux-alpine-x64
            os: ubuntu-latest
          - rid: linux-musl-arm64
            name: officecli-linux-alpine-arm64
            os: ubuntu-latest
          - rid: win-x64
            name: officecli-win-x64.exe
            os: windows-latest
          - rid: win-arm64
            name: officecli-win-arm64.exe
            os: windows-latest
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      # Gate for the macOS signing steps: step-level `if` reads this env instead
      # of the secrets context (Apple cert secrets are fork-absent).
      HAS_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/officecli/officecli.csproj -c Release -r ${{ matrix.rid }} -o publish --nologo

      - name: Assert trim closure keeps required assemblies
        # RID-agnostic static guard (covers the 4 cross-published RIDs the host
        # cannot execute): a trimmed non-single-file publish of the same project
        # must physically contain System.IO.Pipelines.dll (runtime-pack includes it
        # today; an SDK/trimmer regression dropping it fails here first).
        run: |
          dotnet publish src/officecli/officecli.csproj -c Release -r ${{ matrix.rid }} -o trimcheck -p:PublishSingleFile=false --nologo
          test -f trimcheck/System.IO.Pipelines.dll || { echo "FAIL: System.IO.Pipelines.dll missing from ${{ matrix.rid }} trim closure"; exit 1; }

      - name: Rename output
        run: |
          if [ -f publish/officecli.exe ]; then
            mv publish/officecli.exe publish/${{ matrix.name }}
          else
            mv publish/officecli publish/${{ matrix.name }}
          fi

      - name: Setup macOS code signing
        # Fork: skipped when no signing certificate is configured (the upstream
        # Apple developer secrets do not carry over to the fork). A bare CLI
        # binary publishes unsigned; codesigning/notarization activate
        # automatically once the secrets exist.
        if: startsWith(matrix.rid, 'osx-') && env.HAS_CERT == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      - name: Codesign (macOS)
        if: startsWith(matrix.rid, 'osx-') && env.HAS_CERT == 'true'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -n 1 | sed -E 's/.*"(.+)"/\1/')
          echo "Signing with: $IDENTITY"
          # --options runtime (Hardened Runtime, required by notarization) denies the
          # self-contained CoreCLR's MAP_JIT executable memory by default, so the runtime
          # fails to start with "Failed to create CoreCLR, HRESULT: 0x80070008" on every
          # command. build/officecli.entitlements re-permits exactly allow-jit (the plist
          # holds no XML comments — codesign's AMFI parser rejects them).
          codesign --force --options runtime --entitlements build/officecli.entitlements --timestamp --sign "$IDENTITY" publish/${{ matrix.name }}
          codesign --verify --strict --verbose=2 publish/${{ matrix.name }}
          # Fail the build if allow-jit did not actually embed (e.g. a malformed plist
          # makes codesign silently drop entitlements) — otherwise the bug ships again.
          codesign -d --entitlements - --xml publish/${{ matrix.name }} | grep -q allow-jit

      - name: Notarize (macOS)
        if: startsWith(matrix.rid, 'osx-') && env.HAS_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # A bare Mach-O binary cannot be stapled; notarytool requires a
          # zip/pkg/dmg container. Submit a zip — the notarization ticket is
          # recorded on Apple's servers and Gatekeeper validates online.
          ditto -c -k --keepParent publish/${{ matrix.name }} "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --wait
          rm -f "$RUNNER_TEMP/notarize.zip"

      - name: Smoke test - create document
        if: >-
          (matrix.rid == 'osx-arm64' && runner.arch == 'ARM64') ||
          (matrix.rid == 'osx-x64' && runner.arch == 'X64') ||
          (matrix.rid == 'linux-x64' && runner.os == 'Linux') ||
          (matrix.rid == 'win-x64' && runner.os == 'Windows')
        env:
          # Disable Git Bash (MSYS) POSIX-to-Windows path conversion on
          # windows-latest, which otherwise mangles `/body` into
          # `C:/Program Files/Git/body` before it reaches the CLI.
          MSYS_NO_PATHCONV: '1'
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          chmod +x publish/${{ matrix.name }}
          publish/${{ matrix.name }} create test_smoke.docx
          publish/${{ matrix.name }} add test_smoke.docx /body --type paragraph --prop text="Hello from CI"
          publish/${{ matrix.name }} get test_smoke.docx '/body/p[1]'
          publish/${{ matrix.name }} close test_smoke.docx
          rm -f test_smoke.docx

      - name: Smoke test - selftest (loud assembly completeness)
        # Unlike __update-check__ (which swallows ALL updater errors and returns 0
        # unconditionally), __selftest__ exercises LoadConfig->SaveConfig->re-read and
        # fails non-zero on a truncated or assembly-incomplete build. The upstream
        # v1.0.150 fleet incident (Pipelines FileNotFoundException from the first
        # JsonSerializer call on a truncated bundle) would have been caught here.
        # (linux-musl-x64 is NOT static — it needs /lib/ld-musl-x86_64.so.1 which
        # ubuntu lacks — so cross-published RIDs are covered by the trim-closure
        # assertion below instead of a live run.)
        if: >-
          (matrix.rid == 'osx-arm64' && runner.arch == 'ARM64') ||
          (matrix.rid == 'osx-x64' && runner.arch == 'X64') ||
          (matrix.rid == 'linux-x64' && runner.os == 'Linux') ||
          (matrix.rid == 'win-x64' && runner.os == 'Windows')
        env:
          MSYS_NO_PATHCONV: '1'
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          chmod +x publish/${{ matrix.name }}
          publish/${{ matrix.name }} __selftest__
          publish/${{ matrix.name }} --version
          # Release gate: the schema fingerprint must be identical on every RID.
          # Downstream automation pins this CRC to upgrade blind; a divergent
          # RID (v1.0.151 win-x64 shipped b78ff09f vs 7a7d408f elsewhere —
          # CRLF resources from the windows runner checkout) breaks that
          # contract. If this fails after an INTENTIONAL schemas/help change,
          # update the pin here and note it in the release notes.
          CRC="$(publish/${{ matrix.name }} --output-schema-crc)"
          echo "schema crc: $CRC"
          [ "$CRC" = "7a7d408f" ] || { echo "FAIL: schema crc $CRC != 7a7d408f (RID ${{ matrix.rid }} diverges — check .gitattributes/checkout eol)"; exit 1; }

      - name: Smoke test - .NET 8-only runtime (linux-x64)
        if: matrix.rid == 'linux-x64' && runner.os == 'Linux'
        run: |
          chmod +x publish/${{ matrix.name }}
          mkdir -p smoke_net8
          docker run --rm \
            -v "$PWD/publish:/app:ro" \
            -v "$PWD/smoke_net8:/work" \
            -w /work \
            mcr.microsoft.com/dotnet/runtime:8.0 \
            bash -c "set -e; \
              /app/${{ matrix.name }} create issue115.docx; \
              /app/${{ matrix.name }} add issue115.docx /body --type paragraph --prop text='net8 smoke'; \
              /app/${{ matrix.name }} close issue115.docx; \
              /app/${{ matrix.name }} view issue115.docx text --json"

      - name: Smoke test - install
        if: >-
          (matrix.rid == 'osx-arm64' && runner.arch == 'ARM64') ||
          (matrix.rid == 'osx-x64' && runner.arch == 'X64') ||
          (matrix.rid == 'linux-x64' && runner.os == 'Linux') ||
          (matrix.rid == 'win-x64' && runner.os == 'Windows')
        env:
          MSYS_NO_PATHCONV: '1'
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          publish/${{ matrix.name }} install
          if [ "$RUNNER_OS" == "Windows" ]; then
            test -f "$LOCALAPPDATA/OfficeCLI/officecli.exe" || { echo "FAIL: officecli.exe not found in %LOCALAPPDATA%\\OfficeCLI"; exit 1; }
            "$LOCALAPPDATA/OfficeCLI/officecli.exe" --version
          else
            test -f "$HOME/.local/bin/officecli" || { echo "FAIL: officecli not found in ~/.local/bin"; exit 1; }
            "$HOME/.local/bin/officecli" --version
          fi

      - name: Smoke test - install.sh / install.ps1
        # Exercises the shell installers themselves (separate from the CLI's
        # own `install` subcommand tested above), offline via
        # OFFICECLI_LOCAL_BINARY pointing at the freshly built asset — this
        # still covers PATH registration, atomic replace and idempotence.
        # The network legs (env.ohmygh.com mirror -> fork GitHub) are exercised
        # only after the first release is published (draft releases are not
        # visible to /releases/latest).
        if: >-
          (matrix.rid == 'osx-arm64' && runner.arch == 'ARM64') ||
          (matrix.rid == 'osx-x64' && runner.arch == 'X64') ||
          (matrix.rid == 'linux-x64' && runner.os == 'Linux') ||
          (matrix.rid == 'win-x64' && runner.os == 'Windows')
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export OFFICECLI_LOCAL_BINARY="publish/${{ matrix.name }}"
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./install.ps1
            test -f "$LOCALAPPDATA/OfficeCLI/officecli.exe" || { echo "FAIL: officecli.exe not installed"; exit 1; }
            "$LOCALAPPDATA/OfficeCLI/officecli.exe" --version
          else
            export OFFICECLI_LOCAL_BINARY="publish/${{ matrix.name }}"
            bash install.sh
            test -f "$HOME/.local/bin/officecli" || { echo "FAIL: officecli not installed at ~/.local/bin"; exit 1; }
            "$HOME/.local/bin/officecli" --version
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: publish/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      # Gate for the mirror self-seed step (same pattern as HAS_CERT in the
      # build job): fork-absent secrets degrade to a skipped step, never a
      # failed release.
      HAS_R2: ${{ secrets.R2_ENDPOINT != '' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts and generate checksums
        run: |
          mkdir -p flat
          find artifacts -type f -exec mv {} flat/ \;
          rm -rf artifacts
          mv flat artifacts
          cd artifacts
          sha256sum officecli-* > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true

      - name: Seed env mirror (officecli/<ver>/ immutable segment)
        # 自播接线(总台令 2026-09-17「自播,我们验证」):release 即推
        # officecli/<version>/ 段到 env 桶,与 ohmycloud env-seed 同一对象契约
        # (三键资产 + 逐件原生 sha256sum 边车)+ 版本段 immutable 头
        # (x-amz-object-immutable,一次成型防覆写)。
        # --ignore-existing:已播版本(如 v1.0.152 总台手播段)不重推,
        # dispatch 空跑全 SKIP 即绿;新版本段首发即自播。
        if: env.HAS_R2 == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          rclone version | head -1
          export RCLONE_CONFIG_OMCR2_TYPE=s3
          export RCLONE_CONFIG_OMCR2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_OMCR2_ENDPOINT="$R2_ENDPOINT"
          export RCLONE_CONFIG_OMCR2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_OMCR2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_OMCR2_NO_CHECK_BUCKET=true
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p seed
          for f in officecli-win-x64.exe officecli-linux-x64 officecli-mac-arm64; do
            test -f "artifacts/$f" || { echo "FAIL: artifacts/$f missing"; exit 1; }
            cp "artifacts/$f" "seed/$f"
            (cd seed && sha256sum "$f" > "$f.sha256")
          done
          echo "--- seed plan: officecli/$VER/ ---"
          ls -l seed
          rclone copy seed "omcr2:$R2_BUCKET/officecli/$VER" \
            --ignore-existing \
            --header-upload "x-amz-object-immutable: true" \
            --transfers 6 -v
          echo "seed done: rclone ls of segment ->"
          rclone lsf "omcr2:$R2_BUCKET/officecli/$VER" --files-only
